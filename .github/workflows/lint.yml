# Revisa todos los scripts de bash con shellcheck en cada push y pull request.
name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Ejecutar shellcheck en todos los .sh
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo "No hay scripts .sh"
            exit 0
          fi
          printf 'Revisando:\n'; printf '  %s\n' "${scripts[@]}"
          shellcheck -x "${scripts[@]}"
