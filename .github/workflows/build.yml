# Construye la imagen de Llevix, la prueba en QEMU (UEFI + Secure Boot, UEFI y BIOS)
# y guarda la imagen comprimida como artefacto descargable.
name: build

on:
  push:
    branches: [main, 'fase-*']
    paths:
      - 'image/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'image/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # El workflow de publicación (release.yml) lo reutiliza.
  workflow_call:

permissions:
  contents: read

# "shell: bash" explícito activa pipefail: si build.sh falla, el "| tee" no lo oculta.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    name: imagen (${{ matrix.variante }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variante:
          - ubuntu-24.04
          - kubuntu-24.04
          - xubuntu-24.04
          - lubuntu-24.04
          - mint-22-cinnamon
          - mint-22-mate
          - mint-22-xfce
    env:
      SALIDA: /mnt/llevix
      LLEVIX_MIRROR: http://azure.archive.ubuntu.com/ubuntu
    steps:
      - uses: actions/checkout@v5

      - name: Espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p "$SALIDA" && sudo chown "$USER" "$SALIDA"
          df -h / /mnt

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gdisk dosfstools exfatprogs btrfs-progs \
            zstd bmap-tools qemu-system-x86 qemu-utils ovmf seabios socat mtools jq openssl

      - name: Construir imagen
        id: construir
        run: |
          sudo --preserve-env=LLEVIX_MIRROR LLEVIX_OUT="$SALIDA" \
            ./image/build.sh "${{ matrix.variante }}" 2>&1 | tee "$SALIDA/build.log"

      # Se activa después de construir: la instalación de paquetes en el chroot
      # vuelve a aplicar las reglas de udev y deja /dev/kvm solo para root.
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Probar arranque en QEMU
        env:
          LLEVIX_TEST_DIR: ${{ env.SALIDA }}/pruebas
        run: ./tests/qemu-boot-test.sh "$SALIDA/llevix-${{ matrix.variante }}.img"

      - name: Probar primer arranque (usuario, datos, persistencia, errores)
        if: ${{ !cancelled() && steps.construir.outcome == 'success' }}
        env:
          LLEVIX_TEST_DIR: ${{ env.SALIDA }}/pruebas
        run: ./tests/firstboot-test.sh "$SALIDA/llevix-${{ matrix.variante }}.img"

      - name: Probar resistencia (ajustes del disco, estados, apagado brusco)
        if: ${{ !cancelled() && steps.construir.outcome == 'success' }}
        env:
          LLEVIX_TEST_DIR: ${{ env.SALIDA }}/pruebas
        run: ./tests/resistencia-test.sh "$SALIDA/llevix-${{ matrix.variante }}.img"

      - name: Mapa de bloques (.bmap) y tamaño
        run: |
          cd "$SALIDA"
          img="llevix-${{ matrix.variante }}.img"
          bmaptool create -o "$img.bmap" "$img"
          stat -c %s "$img" > "$img.tamano"
          grep -c "<Range" "$img.bmap"

      - name: Comprimir imagen
        run: |
          cd "$SALIDA"
          zstd -T0 -9 --rm "llevix-${{ matrix.variante }}.img"
          sha256sum "llevix-${{ matrix.variante }}.img.zst" > "llevix-${{ matrix.variante }}.img.zst.sha256"
          ls -lh

      - name: Guardar imagen
        uses: actions/upload-artifact@v5
        with:
          name: llevix-${{ matrix.variante }}.img.zst
          path: |
            ${{ env.SALIDA }}/llevix-${{ matrix.variante }}.img.zst
            ${{ env.SALIDA }}/llevix-${{ matrix.variante }}.img.zst.sha256
            ${{ env.SALIDA }}/llevix-${{ matrix.variante }}.img.bmap
            ${{ env.SALIDA }}/llevix-${{ matrix.variante }}.img.tamano
            ${{ env.SALIDA }}/llevix-${{ matrix.variante }}.paquetes.txt
          compression-level: 0
          retention-days: 14

      - name: Guardar registros y capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: registros-${{ matrix.variante }}
          path: |
            ${{ env.SALIDA }}/build.log
            ${{ env.SALIDA }}/pruebas/
          if-no-files-found: ignore
          retention-days: 14
