# Variante especial: "Llevix instalador" (fase 8, "Trae tu ISO").
# No es un escritorio: es un sistema mínimo que en el primer arranque instala en el disco
# la distro de la ISO que eligió el usuario (image/instalador/instalar-iso.sh).
# El creador no la muestra en el catálogo.

TIPO="instalador"
NOMBRE_VISIBLE="Llevix: instalador de ISO"
BASE="ubuntu"
SUITE="noble"
# Kernel HWE (7.0 en 2026): abre el EROFS con LZMA de Fedora 42 y posteriores (el 6.8
# normal no, y leerlo con erofsfuse tarda unos 45 minutos). También reconoce PCs más nuevas.
PAQUETE_KERNEL="linux-generic-hwe-24.04"
# erofs-utils y erofsfuse: respaldo si el kernel no abre algún EROFS.
PAQUETES_ESCRITORIO="squashfs-tools rsync sbsigntool erofs-utils erofsfuse"
PAQUETES_IDIOMA=""
GESTOR_SESION="ninguno"
LIGERA="no"
DESCRIPCION="Instala en el disco la distro de una ISO elegida por el usuario."
