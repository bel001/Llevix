# Variante: Zorin OS 18 Core (base Ubuntu 24.04).
# TIPO=desde-iso: se construye instalando la ISO OFICIAL con el instalador de Llevix
# (image/desde-iso.sh), así queda exactamente como la entrega Zorin, con la capa de Llevix.

TIPO="desde-iso"
NOMBRE_VISIBLE="Llevix, basado en Zorin OS 18 Core"
BASE="ubuntu"
SUITE="noble"
ISO_URL="https://mirrors.edge.kernel.org/zorinos-isos/18/Zorin-OS-18.1-Core-64-bit.iso"
ISO_SUMAS="https://mirrors.edge.kernel.org/zorinos-isos/18/SHA256SUMS.txt"
# build.sh no construye esta variante; estos campos solo cumplen el formato.
PAQUETES_ESCRITORIO="(desde la ISO oficial)"
GESTOR_SESION="gdm3"
LIGERA="no"
DESCRIPCION="Zorin OS: escritorio pulido con aspecto parecido a Windows o macOS. Recomendado con 8 GB de RAM."
