# Variante: Linux Mint 22 con MATE
# Este archivo lo lee image/build.sh (se carga con "source").

# Nombre que ve el usuario. Nunca usar el nombre de la distro como marca del producto.
NOMBRE_VISIBLE="Llevix, basado en Linux Mint 22 MATE"

# Base y versión de la distribución.
BASE="mint"
SUITE="noble"
# Versión de Linux Mint 22 (22.3 "zena", la más reciente de la serie 22).
MINT_SUITE="zena"

# Paquetes del escritorio, tal como los trae la distribución.
# Respaldo: el escritorio sale de image/distros/paquetes/mint-22-mate.txt (lista de la ISO oficial).
PAQUETES_ESCRITORIO="mint-meta-mate lightdm slick-greeter lightdm-settings"

# Traducciones al español.
PAQUETES_IDIOMA="language-pack-es language-pack-gnome-es hunspell-es firefox-locale-es"

# Gestor de inicio de sesión (gdm3, sddm o lightdm).
GESTOR_SESION="lightdm"

# "si" para las variantes pensadas para PCs con poca RAM.
LIGERA="si"

# Descripción corta en español (la muestra el creador).
DESCRIPCION="MATE: clásico y liviano. Bueno para PCs con 4 GB de RAM."
