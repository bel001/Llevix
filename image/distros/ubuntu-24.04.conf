# Variante: Ubuntu 24.04 LTS con el escritorio GNOME de Ubuntu.
# Este archivo lo lee image/build.sh (se carga con "source").

# Nombre que ve el usuario. Nunca usar "Ubuntu" como marca del producto.
NOMBRE_VISIBLE="Llevix, basado en Ubuntu 24.04 LTS"

# Base y versión de la distribución.
BASE="ubuntu"
SUITE="noble"

# Paquetes del escritorio, tal como los trae la distribución.
PAQUETES_ESCRITORIO="ubuntu-desktop-minimal"

# Gestor de inicio de sesión (gdm3, sddm o lightdm).
GESTOR_SESION="gdm3"

# "si" para las variantes pensadas para PCs con poca RAM.
LIGERA="no"
