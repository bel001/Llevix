# Variante: Kubuntu 24.04 LTS con KDE Plasma
# Este archivo lo lee image/build.sh (se carga con "source").

# Nombre que ve el usuario. Nunca usar el nombre de la distro como marca del producto.
NOMBRE_VISIBLE="Llevix, basado en Kubuntu 24.04 LTS"

# Base y versión de la distribución.
BASE="ubuntu"
SUITE="noble"

# Paquetes del escritorio, tal como los trae la distribución.
PAQUETES_ESCRITORIO="kubuntu-desktop"

# Traducciones al español.
PAQUETES_IDIOMA="language-pack-es language-pack-kde-es hunspell-es"

# Gestor de inicio de sesión (gdm3, sddm o lightdm).
GESTOR_SESION="sddm"

# "si" para las variantes pensadas para PCs con poca RAM.
LIGERA="no"

# Descripción corta en español (la muestra el creador).
DESCRIPCION="KDE Plasma: muy configurable, con aspecto parecido a Windows. Recomendado con 8 GB de RAM."
