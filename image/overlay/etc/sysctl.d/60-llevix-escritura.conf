# Llevix: escribir al disco de a poco, para que un USB lento no congele el sistema.
#
# Sin esto, Linux junta en la RAM hasta el 20 % de la memoria en escrituras pendientes
# (unos 5 GB en una PC con 24 GB) y después las manda todas juntas. Una memoria USB
# que escribe a pocos MB/s tarda minutos en tragarlas, y mientras tanto cualquier
# programa que guarde algo (el navegador al abrirse, la configuración) se queda
# esperando: parece que la PC se colgó.
#
# Con un límite fijo y pequeño, el sistema escribe continuamente en trozos cortos.
# En un SSD rápido no cambia nada perceptible.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648
